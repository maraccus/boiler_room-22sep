<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  
  <nav class="navbar">
    <ul>
        <li><a href="#hero">Home</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  
  <section class="hero">
    <h1>Welcome to Coffee Time</h1>
    <p>Your daily dose of energy and warmth</p>
    <a href="#menu" class="btn">See Our Menu</a>
  </section>
  
  <section class="gallery">
    <img src="coffee1.jpg" alt="Coffee cup" />
    <img src="coffee2.jpg" alt="Barista at work" />
    <img src="coffee3.jpg" alt="Freshly brewed coffee" />
  </section>
  
  <section class="contact">
  <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Your Name" />
      <input type="email" placeholder="Your Email" />
      <textarea placeholder="Your Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  
  <footer>
    <p>© 2025 Coffee Time. All rights reserved.</p>
  </footer>
    
</body>
</html>
